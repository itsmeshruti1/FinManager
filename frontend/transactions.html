<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions - Personal Finance Manager</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="logo">Fin<span>Manager</span></div>
            <ul class="nav-links">
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="transactions.html" class="active">Transactions</a></li>
                <li><a href="budgets.html">Budgets</a></li>
            </ul>
        </aside>
        
        <main class="main-content">
            <header class="page-header">
                <h1 class="page-title">Transactions</h1>
            </header>

            <div class="card">
                <h3 class="card-title">Add New Transaction</h3>
                <form id="transaction-form">
                    <div class="form-group">
                        <label class="form-label">Type</label>
                        <select class="form-control" id="trans-type" required>
                            <option value="expense">Expense</option>
                            <option value="income">Income</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Amount</label>
                        <input type="number" step="0.01" class="form-control" id="trans-amount" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Date</label>
                        <input type="date" class="form-control" id="trans-date" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Description / Category</label>
                        <input type="text" class="form-control" id="trans-desc" placeholder="e.g. Groceries">
                    </div>
                    <button type="submit" class="btn btn-primary">Add Transaction</button>
                </form>
            </div>

            <div class="card">
                <h3 class="card-title">All Transactions</h3>
                <ul class="transaction-list" id="all-transactions">
                    <!-- Transactions injected here -->
                </ul>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/transactions.js"></script>
</body>
</html>
