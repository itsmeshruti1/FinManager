<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budgets - Personal Finance Manager</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="logo">Fin<span>Manager</span></div>
            <ul class="nav-links">
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="transactions.html">Transactions</a></li>
                <li><a href="budgets.html" class="active">Budgets</a></li>
            </ul>
        </aside>
        
        <main class="main-content">
            <header class="page-header">
                <h1 class="page-title">Budgets</h1>
            </header>

            <div class="card">
                <h3 class="card-title">Set Monthly Budget</h3>
                <form id="budget-form">
                    <div class="form-group">
                        <label class="form-label">Category Name</label>
                        <input type="text" class="form-control" id="budget-category" placeholder="e.g. Groceries" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Monthly Limit</label>
                        <input type="number" step="0.01" class="form-control" id="budget-limit" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Month (YYYY-MM)</label>
                        <input type="month" class="form-control" id="budget-month" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Save Budget</button>
                </form>
            </div>

            <div class="card">
                <h3 class="card-title">Current Budgets</h3>
                <div id="budgets-list">
                    <!-- Budgets injected here -->
                </div>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/budgets.js"></script>
</body>
</html>
